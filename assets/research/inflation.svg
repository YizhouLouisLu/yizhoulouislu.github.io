  <text x="49" y="34" fill="#c6d6c7" font-family="Arial, sans-serif" font-size="15">Field 2</text>
  <text x="336" y="215" fill="#c6d6c7" font-family="Arial, sans-serif" font-size="15">Field 1</text>
