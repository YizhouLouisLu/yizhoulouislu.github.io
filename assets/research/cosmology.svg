    <g fill="#dcc39a" font-size="13.5"><text x="215" y="59">Rare peaks collapse</text><text x="215" y="167">Second-order sourcing</text></g>
    <g fill="#f3f3df" font-size="17" font-weight="500"><text x="215" y="82">Primordial black holes</text><text x="215" y="189">Induced gravitational</text><text x="215" y="211">waves</text></g>
  </g>
